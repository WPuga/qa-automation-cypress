name: Cypress Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-tests:
    name: 🌐 Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Cypress run (Web)
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npx cypress run --spec "cypress/e2e/desafio_web.feature"

      - name: Upload Web Screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: web-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Web Videos
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-videos
          path: cypress/videos
          if-no-files-found: ignore

  api-tests:
    name: ⚙️ API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Cypress run (API)
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: npx cypress run --spec "cypress/e2e/desafio_api.feature"

      - name: Upload API Screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: api-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload API Videos
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-videos
          path: cypress/videos
          if-no-files-found: ignore
